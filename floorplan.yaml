    discrepancies:
    - axis: left wing width
      top_cm: 435.7
      bottom_cm: 434.5
      difference_cm: 1.2
      resolution: 以頂部完整尺寸鏈435.7為定位基準，未將1.2cm差異隱藏。
    - axis: overall depth
      central_cm: 610.4
      left_cm: 609.3
      difference_cm: 1.1
      resolution: 以中央264.7+80+265.7=610.4定位。
    - axis: kitchen depth
      internal_chain_cm: 410.9
      right_chain_cm: 408.5
      difference_cm: 2.4
      resolution: 以右側178.8+90+60+79.7=408.5定位。
