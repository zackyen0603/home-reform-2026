  measurement:
    dimension_source: 1150917新北市三重區六張街164號裝修工程.pdf / page 1 / A03 / 2026-09-14
    status: dimension-chain-reconstruction
    units: cm
    wall_detection_rule: 只描繪牆體剖面線；400mm電視櫃、衣櫃及家電不屬牆體。
    notes:
    - 四樓室內依本次完整PDF採L形外框，右下樓梯不納入室內地坪。
    - 兩臥房共用90cm淨深、80cm寬的內凹走道；門位於走道北、南兩側。
    - 客餐廳至廚房為90cm無門開口；家事前室至洗衣區亦為無門開口。
    - 牆線採中心線近似；尺寸鏈保留淨尺寸及櫃體尺寸，不能把40cm電視櫃當隔間牆。
    dimension_chains:
      top_x:
      - 37.8
      - 70
      - 182
      - 145.9
