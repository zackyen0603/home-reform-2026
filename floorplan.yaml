schema_version: "1.0.0"

metadata:
  project_id: home-reform-2026
  dataset: floorplan-coordinates
  title: 平面圖座標與智慧設備定位
  last_updated: 2026-09-22
  source_of_truth: false
  measurement_status: schematic-not-for-construction
  warning: 目前座標依既有尺寸與討論建立示意模型；正式施工前必須以現場丈量及核定施工圖更新。

coordinate_system:
  units: cm
  origin: top-left
  x_axis: right
  y_axis: down
  z_axis: up
  angle_units: degrees
  polygon_rule: clockwise-or-counterclockwise-closed-implicitly
  three_d_mapping:
    x: x
    y: z
    z: y

render_defaults:
  wall_height: 280
  wall_thickness: 12
  slab_thickness: 12
  colors:
    background: "#f4f0e7"
    wall: "#57554f"
    room: "#ded5c6"
    wet_area: "#c8d5d1"
    circulation: "#e7dece"
    door: "#9a7558"
    window: "#6f98a0"
    device_planned: "#b18b55"
    device_active: "#62785d"
    device_alert: "#b95742"

import_contract:
  accepted_formats:
    - YAML
    - JSON
  required_keys:
    - schema_version
    - floors
  required_floor_keys:
    - id
    - bounds
    - rooms
    - walls
  notes:
    - 所有座標及尺寸一律使用公分。
    - room polygon至少需要3個點，每個點格式為[x, y]。
    - wall以start與end兩點定義，3D高度由height或render_defaults.wall_height取得。
    - device的smart_home_id需對應smart-home.yaml內devices.id。

