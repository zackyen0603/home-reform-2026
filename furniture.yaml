  coordinate_unit: cm
  origin: 四樓平面圖左上角；x 向右、y 向下、z 向上
  placement_note: 家具中心點與朝向均為依現有格局暫擬；尺寸欠缺者為預覽估值，施工及採購前須依型號與動線校正。 2026-09-23依完整PDF修正左側臥房位置；家具尺寸維持原資料，未量測位置仍為估值。
  rotation_note: rotation_deg 是平面圖中繞中心順時針旋轉的角度；3D 中繞垂直軸對應旋轉。
