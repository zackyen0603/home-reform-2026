schema_version: "1.0"
project:
  name: home-reform-2026
  title: 2026 居家整修規劃
  location: 新北市三重區
  scope:
    - 1F 門面與玄關
    - 4F 居住空間
  target_layout_4f: 2房2衛1客廳1餐廳1廚房
  style:
    primary: Japandi／日式無印
    accents:
      - 侘寂感
      - 暖白與暖灰
      - 淺木紋
      - 少量深木與黑色五金
  last_updated: "2026-09-22"

status_definition:
  decided: 已決定
  planned: 已納入規劃，規格仍可微調
  evaluating: 選項比較中
  pending: 尚待確認
  purchased: 已購買
  cancelled: 已取消

priority_definition:
  P0: 施工前必須確認，會影響結構、管線或封板
  P1: 主要設備與空間功能
  P2: 家具、外觀及使用體驗
  P3: 可於後期決定

constraints:
  - id: CON-001
    category: 法規
    requirement: 4F為列管既存違建，採室內修繕與非結構性調整
    status: decided
    priority: P0
    notes:
      - 不增加面積或高度
      - 不外推、不加蓋、不封陽台成室內
      - 不拆梁柱、不切割樓板
      - 非承重隔間調整仍需事前確認
  - id: CON-002
    category: 材料
    requirement: 電線優先指定太平洋電線
    status: planned
    priority: P0
  - id: CON-003
    category: 採購
    requirement: 自購或刪除項目後，報價須同步扣除材料、管理費與營業稅
    status: planned
    priority: P1
  - id: CON-004
    category: 採購
    requirement: 電燈開關與插座面板考慮屋主自購，扣除國際星光面板
    status: planned
    priority: P1

