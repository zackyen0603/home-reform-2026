<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>系統櫃設計器</title><style>
:root{font-family:system-ui,sans-serif;color:#292a26;background:#f4f1ea}*{box-sizing:border-box}body{margin:0}header{padding:16px 24px;background:#272e29;color:white;display:flex;justify-content:space-between;align-items:center}a{color:inherit}main{display:grid;grid-template-columns:320px 1fr;gap:18px;padding:18px;max-width:1500px;margin:auto}aside,article{background:white;border-radius:12px;padding:18px;box-shadow:0 2px 14px #0001}label{display:block;margin:12px 0;font-size:13px;font-weight:600}input,select{width:100%;padding:9px;border:1px solid #c5c4bb;border-radius:7px;font:inherit}button{background:#3b6654;color:white;border:0;padding:10px 14px;border-radius:8px;cursor:pointer;margin:4px}button.secondary{background:#eee;color:#333}button:focus-visible{outline:3px solid #6b9} .row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.preview{min-height:400px;display:grid;place-items:center;background:#e8e6df;border-radius:8px;overflow:hidden}svg{max-width:100%;max-height:530px}#three{width:100%;height:490px;display:none}#message{color:#365b43;font-size:14px;min-height:20px}.muted{color:#777;font-size:13px}@media(max-width:800px){main{grid-template-columns:1fr}header{padding:12px}.preview{min-height:280px}}
</style><script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script><script src="./assets/cabinet-core.js"></script></head><body>
<header><strong>系統櫃設計器 · Cabinet Designer</strong><a href="./#floorplan">← 回住宅空間</a></header>
<main><aside><h2>櫃體參數</h2><label>既有設計<select id="existing"></select></label><button class="secondary" id="new">新增櫃體</button><label>名稱<input id="name"></label><div class="row"><label>樓層<select id="floor"></select></label><label>房間<select id="room"></select></label></div><div class="row"><label>寬度 cm<input id="width" type="number" min="30" max="600" step=".1"></label><label>深度 cm<input id="depth" type="number" min="20" max="120" step=".1"></label><label>高度 cm<input id="height" type="number" min="30" max="300" step=".1"></label><label>模組數<input id="modules" type="number" min="1" max="12" step="1"></label></div><div class="row"><label>板厚 cm<input id="panel" type="number" min=".9" max="4" step=".1"></label><label>門片<select id="doors"><option value="open">開放式</option><option value="hinged">平開門</option></select></label></div><h3>空間定位（cm）</h3><div class="row"><label>中心 X<input id="x" type="number" step="1"></label><label>中心 Y<input id="y" type="number" step="1"></label><label>角度<input id="rotation" type="number" step="5"></label><label>離地 Z<input id="z" type="number" min="0" step="1"></label></div><button id="save">儲存並加入住宅</button><button id="delete" class="secondary">刪除</button><button id="download" class="secondary">匯出 YAML</button><p id="message" role="status"></p><p class="muted">設計存於此瀏覽器 localStorage，住宅平面圖與 3D 會讀取同一份資料。跨裝置請匯出 YAML；目前尚未自動提交至 GitHub。</p></aside>
<article><h2>即時預覽</h2><div class="tabs"><button id="elevation" class="secondary">2D 立面</button><button id="plan" class="secondary">2D 平面</button><button id="view3d" class="secondary">3D 模型</button></div><div class="preview"><svg id="drawing" viewBox="0 0 600 440" aria-label="系統櫃預覽"></svg><div id="three"></div></div><p class="muted">預覽顯示等寬模組、側板、頂底板、隔板及門片。施工用背板、五金、裁切清單尚未完成，請勿直接作為下單圖。</p><h3>模組資訊</h3><div id="stats"></div></article></main><script src="./assets/cabinet-editor.js"></script></body></html>
