systems:
  network:
    topology: 中華電信小烏龜由1F接入，經主路由器分配至1F與4F AP，全屋維持同一區域網路
    wan_entry_floor: 1F
    lan_policy: single-lan
    wired_reservations:
      - 機櫃
      - 各樓層吸頂AP
    rack:
      planned_devices:
        - 桌機
        - NAS
        - 路由器／交換器
        - Home Assistant主機
      status: planning

  electrical:
    wire_brand_preference: 太平洋電線
    neutral_wire_policy: 電燈開關盒預留中性線
    owner_supplied:
      - 電燈開關面板
      - 插座面板
    circuits:
      - id: general-outlets
        voltage: 110
        conductor_mm2: 2.0
        quantity: 3
      - id: lighting
        voltage: 110
        conductor_mm2: 2.0
        quantity: 1
        neutral_required_at_switch: true
      - id: bathrooms
        voltage: 110
        conductor_mm2: 2.0
        quantity: 2
      - id: bathroom-heaters
        voltage: 220
        conductor_mm2: 5.5
        quantity: 2
        dedicated: true
      - id: ih-cooktop
        voltage: 220
        conductor_mm2: 5.5
        quantity: 1
        dedicated: true
      - id: dishwasher
        voltage: 110
        conductor_mm2: 5.5
        quantity: 1
        dedicated: true
      - id: washer-dryer
        voltage: 110
        conductor_mm2: 5.5
        quantity: 1
        dedicated: true
      - id: air-conditioners
        voltage: 220
        conductor_mm2: 5.5
        quantity: to-confirm
        dedicated: true
    safety_notes:
      - 浴室暖風機與照明原則上分迴路
      - IH、洗碗機、洗烘衣機、冷氣使用獨立迴路
      - 瞬熱飲水機是否設獨立迴路依銘牌功率與同迴路負載確認

  hvac:
    air_conditioning:
      first_floor:
        target_capacity_kw:
          - 5.0
          - 6.3
        current_candidate: 日立RAS-50YSP1
      fourth_floor_living:
        current_candidate: 日立RAS-50YSP
      bedrooms:
        candidates:
          outdoor: RAM-50YP
          main: RAS-28YSP
          secondary: RAS-22YSP
      installation_policy: 未即時裝機處仍先預留電源、銅管、排水與維修路徑
    dehumidifier:
      model: 日立RDI-360DX
      type: 吊隱式

  plumbing:
    under_sink_filter: planned
    instant_hot_dispenser: under-evaluation
    waterproofing_policy: 濕區降板、防水及試水紀錄需納入驗收

  smart_home:
    data_source: smart-home.yaml
    floorplan_source: floorplan.yaml
    platform: Home Assistant
    protocols:
      - Zigbee
      - Wi-Fi
      - Ethernet
    summary: 詳細設備、配線、自動化、安全規則及驗收測試統一由smart-home.yaml維護。

