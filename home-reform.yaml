            height: 75.5
          - width: 45
            height: 75.5
      prep_drawers:
        width: 60
        heights:
          - 22.5
          - 18
          - 32
      ih_zone:
        total_width: 80
        left_filler: 10
        appliance_width: 60
        right_filler: 10
        drawer_height: 22.5
    status: design-development

  - id: 4f-storage
    floor: 4F
    name: 儲藏室
    category: storage
    dimensions:
      length: 174.7
      width: 96.6
      clear_height: 280
      wall_area_m2: 15.1928
      paint_area_ping: 4.5730
      floor_area_m2: 1.6876
      floor_area_ping: 0.5080
    requirements:
