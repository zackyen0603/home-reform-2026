schema_version: "1.0.0"

metadata:
  project_id: home-reform-2026
  title: 居家整修規劃
  owner: Zack Yen
  language: zh-TW
  timezone: Asia/Taipei
  last_updated: 2026-09-22
  data_status: working-draft
  source_of_truth: true
  conventions:
    dimensions: cm
    area: m2
    floor_area: ping
    electrical_voltage: V
    power: kW
    currency: TWD

project:
  location:
    city: 新北市
    district: 三重區
  building:
    type: 透天厝
    registered_floors: 2
    actual_floors: 5
    approximate_completion: "1991年前"
    regulatory_notes:
      - id: regulation-4f-existing-addition
        floor: 4F
        subject: 既存違建
        status: needs-verification
        detail: 4F室內為既存列管違建；拆隔間、地磚、雨遮及修繕範圍須先確認可施工界線。
  target_program:
    bedrooms: 2
    bathrooms: 2
    living_rooms: 1
    kitchens: 1
  project_goals:
    - id: goal-layout
      title: 完成一樓與四樓整修及設備整合
      priority: high
    - id: goal-style
      title: 建立日式無印、Japandi與侘寂感一致的材料語彙
      priority: high
    - id: goal-smart-home
      title: 裝修階段完成智慧家庭、網路與必要線路預留
      priority: high
    - id: goal-maintainability
      title: 保留設備維修性並以結構化資料追蹤決策
      priority: medium

design:
  style:
    primary: Japandi
    alternatives:
      - 日式無印
      - 侘寂
      - 深木色方案
    keywords:
      - 溫潤木質
      - 暖灰
      - 奶茶灰
      - 柔米白
      - 簡潔留白
  lighting:
    bathroom_color_temperature_k: 4000
    kitchen_preferred_color_temperature_k:
      - 4000
      - 5000
    living_room_main_light:
      type: 吸頂燈
      adjustable_color_temperature_k: "3000-6500"
      candidate: Hotalux AURA
    control_policy: 牆面只需開關，不需牆上直接調光
  materials:
    kitchen_upper_cabinet: 奶茶灰或淺灰
    kitchen_lower_cabinet: 橡木紋
    island: 橡木紋
    countertop: 樂天或LG人造石・柔米白
    kitchen_backsplash: 白色烤漆玻璃
    kitchen_floor: 暖灰微水泥
    living_floor: 超耐磨木地板
    entrance_exterior_floor: 抿石子
    entrance_wall: 水泥漆

spaces:
  - id: 1f-entrance
    floor: 1F
    name: 玄關／落塵區
    category: entrance
    dimensions:
      length: 593
      width: 214
      clear_height: 340
    requirements:
      - 內凹大門改為直線配置
      - 落塵區保留既有30×30公分地磚
      - 牆外地坪使用抿石子
      - 與客廳間設木作隔間
      - 門洞保留90至100公分並維持採光
      - 評估穀倉拉門、清玻木門或類似4F儲藏室門款
      - 入口軌道燈，儲物區吸頂燈
    openings:
      entrance_door:
        width: 111
        position: 正面最右側
        swing: 向右開
        handle_side: 左
      facade_window:
        width: 110
        height: 130
        sill_height: 100
        security_window: true
      door_window_spacing: 60
      facade_total_width: 600
    exterior:
      wall_finish: 洗石子
      rolling_door: 全開時保留原外側鐵門
      ramp: 正面小斜坡
      glass_block: removed-from-plan
      lighting: 僅門口上方一盞
      nameplate:
        text: 顏
        style: 日式灰白小型門牌
    status: planning

  - id: 1f-guest-room
    floor: 1F
    name: 客房
    category: bedroom
    requirements:
      - 預留冷氣電源、銅管與排水路徑
    status: planning

  - id: 4f-living-dining
