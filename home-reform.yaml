  - id: 4f-kitchen-zone
    floor: 4F
    name: 廚房區（含側浴與儲藏室）
    category: kitchen-zone
    dimensions:
      length: 408.5
      width: 407.1
      clear_height: 280
      perimeter_m: 16.312
      wall_area_m2: 45.6736
      paint_area_ping: 13.7478
      floor_area_m2: 16.629
      floor_area_ping: 5.0056
    status: design-development

  - id: 4f-kitchen
    floor: 4F
    name: 廚房
    category: kitchen
    requirements:
      - 開放式廚房
      - 中島作為獨立吧檯
      - 主廚具立面總寬230公分
      - 水槽、60公分備料抽屜、80公分IH區依序配置
