contract_and_procurement:
  shared_negotiation_items:
    - id: quote-wire-brand
      request: 報價與施工規範註明使用太平洋電線
      status: pending-contractor-response
    - id: quote-second-fix-labor
      request: 1F與4F二次施工同時進場，由合計4工調整為共用2工
      status: pending-contractor-response
    - id: quote-ac-model-difference
      request: 說明1F RAS-50YSP1與4F RAS-50YSP價差2000元是否為新舊款差異
      status: pending-contractor-response
    - id: quote-switch-deduction
      request: 自購電燈開關與插座面板，報價扣除星光面板材料
      status: pending-contractor-response
  first_floor_change_requests:
    - 內凹大門改直線
    - 落塵區保留原地磚，牆外地坪改抿石子
    - 客廳局部壁坪拆除改為油漆批土填平
    - 木作隔間保留90至100公分採光門洞
    - 採光門預算約新台幣30000元
    - 先安裝客廳5.0kW或6.3kW冷氣
    - 預留客房冷氣線路

decisions:
  - id: decision-entrance-floor
    date: 2026-09-14
    topic: 一樓玄關地坪
    decision: 落塵區保留原地磚，牆外使用抿石子
    status: decided
  - id: decision-faucet-procurement
    date: 2026-09-14
    topic: 廚房龍頭
    decision: RECO RISS 103014-B改由屋主自購
    status: decided
  - id: decision-switch-control
    date: 2026-09-22
    topic: 燈光控制
    decision: 牆面只需開關，不需牆上調光；保留實體控制
    status: decided
  - id: decision-network
    date: 2026-09-22
    topic: 家庭網路
    decision: 1F電信入口經主路由器連接1F與4F AP，維持單一LAN
    status: decided

open_issues:
  - id: issue-regulatory-boundary
    category: regulation
    title: 4F既存違建可修繕範圍
    question: 紅磚隔間、地磚、雨遮等拆修是否需室內裝修許可或另行申請
    owner: homeowner
    priority: high
    status: open
  - id: issue-ac-capacity-1f
    category: hvac
    title: 1F客廳冷氣容量
    question: 依實際熱負荷確認採5.0kW或6.3kW
    owner: hvac-contractor
    priority: high
    status: open
  - id: issue-rolling-door-voltage
    category: smart-home
    title: 鐵捲門控制端規格
    question: 現場量測三鍵控制線電壓、共用端與互鎖方式
    owner: electrician
    priority: high
    status: open
  - id: issue-instant-hot-circuit
    category: electrical
    title: 瞬熱飲水機迴路
    question: 依最後選定機型功率確認是否設獨立迴路
    owner: electrician
    priority: medium
    status: open
  - id: issue-kitchen-sink
    category: procurement
    title: 廚房水槽選型
    question: 大吉熊與LIXIL之清潔、配件、保固與安裝相容性比較
    owner: homeowner
    priority: medium
    status: open

validation_rules:
  ids_unique: true
  required_top_level_keys:
    - metadata
    - project
    - spaces
    - systems
    - equipment
    - decisions
    - open_issues
  enums:
    status:
      - idea
      - planning
      - design-development
      - comparing
      - candidate
      - selected
      - planned
      - purchased
      - pending-contractor-response
      - design-required
      - electrical-review
      - needs-verification
      - open
      - decided
