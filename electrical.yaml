schema_version: 1.0.0
metadata:
  project_id: home-reform-2026
  dataset: electrical-layout
  title: 四樓插座、燈具與回路配置
  language: zh-TW
  last_updated: 2026-09-22
  source_of_truth: true
  data_status: drawing-extracted-needs-electrical-review
  warning: 點位座標依配置示意圖換算並對應floorplan.yaml；空間歸屬已依施工圖尺寸軸與家具排除後的牆面格局重算。回路分組為規劃案，施工前須由合格電工依負載、配電盤容量與現場管路確認。
  lighting_reconciliation_note: 試算表「★燈具&插座智慧家庭規劃」合計吸頂燈5、吊燈3、嵌燈23，與目前點位圖的吸頂燈4、吊燈3、崁燈33不一致；本視圖以
    electrical.yaml 的點位圖辨識資料為準，需現場核對版本。
sources:
- id: SRC-4F-OUTLETS
  file: IMG_3159.jpeg
  subject: 四樓插座配置
  declared_counts:
    high_level_outlet: 3
    planned_220v: 8
    general_outlet: 26
    optional_outlet: 3
  extracted_counts:
    high_level_outlet: 3
    planned_220v: 8
    general_outlet: 27
    optional_outlet: 3
  qa_status: count-mismatch
  qa_note: 圖例標示一般插座26處，但依色塊辨識得到27處；各點均保留並標示待逐點覆核，避免誤刪。
- id: SRC-4F-LIGHTS
  file: IMG_3160.jpeg
  subject: 四樓燈具配置
  declared_counts:
    downlight: 33
    pendant: 3
    ceiling_light: 4
  extracted_counts:
    downlight: 33
    pendant: 3
    ceiling_light: 4
  qa_status: matched
coordinate_system:
  units: cm
  floor_id: 4F
  reference: floorplan.yaml
  reference_bounds:
    width: 1203.6
    depth: 610.4
  source_diagram_bounds:
    width: 1255
    depth: 664
  mapping: normalized-stretch-to-floor-bounds
  origin: top-left
  x_axis: right
  y_axis: down
  z_axis: up
  accuracy: schematic
  edit_rule: 修改position的[x,y,z]即可同步更新網頁點位；x、y須位於reference_bounds內。
distribution_panel:
  id: DB-4F-01
  name: 四樓房間電箱
  room_id: 4f-main-bedroom
  position:
  - 21.4
  - 261.3
  - 150
  position_status: estimated-from-user-description
  note: 使用者指出電箱在主臥床左側；靠西側實牆的圖面座標僅供預覽，現場位置及盤內空間待量測。
route_preview:
  method: planar-shortest-path-around-modeled-walls
  status: schematic-only
  note: 路徑依圖面牆段與門洞自動產生，只檢查平面連通與繞行；不是實際導線管、分線盒、天花或牆內走線，也不代表線徑、電壓降與斷路器設計通過。
lighting_preview:
  status: visual-estimate-only
  note: 燈具外形、色溫與照射範圍為辨識配置用的示意值，並非選定型號、照度計算或施工規格；可在各點位增設 fixture_visual 欄位覆寫同類預設。
  default_ambient_percent: 65
  fixture_types:
    downlight:
      diameter_cm: 12
      beam_radius_cm: 95
      beam_angle_deg: 40
      lumens: 700
      color_temperature_k: 4000
      model: recessed-round
    pendant:
      diameter_cm: 29
      beam_radius_cm: 120
      lumens: 800
      color_temperature_k: 3000
      model: hanging-shade
    ceiling_light:
      diameter_cm: 44
      beam_radius_cm: 185
      lumens: 1800
      color_temperature_k: 4000
      model: flush-diffuser
